<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Riego ESP32</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #090d16);
      color: var(--tg-theme-text-color, #f8fafc);
      padding: 16px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 400px; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #131b2e);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid #1e293b;
    }
    h3 { margin-top: 0; color: #10b981; font-size: 18px; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-top: 10px; }
    
    .counter-row { display: flex; justify-content: center; margin: 12px 0; }
    .counter-box { display: flex; align-items: center; background: #0f172a; border-radius: 10px; padding: 4px; }
    .counter-btn { background: #1e293b; color: #fff; border: none; width: 40px; height: 40px; font-size: 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .counter-val { min-width: 60px; text-align: center; font-size: 18px; font-weight: bold; }

    .btn-grid { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      flex: 1; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .btn-regar { background: #10b981; color: #090d16; }
    .btn-parar { background: #ef4444; color: #ffffff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h3>⚡ Control Manual de Riego</h3>
      <label>Duración del ciclo manual en minutos:</label>
      
      <div class="counter-row">
        <div class="counter-box">
          <button class="counter-btn" onclick="cambiar(-0.5)">-</button>
          <span id="minsLabel" class="counter-val">0.5</span>
          <button class="counter-btn" onclick="cambiar(0.5)">+</button>
        </div>
      </div>

      <div class="btn-grid">
        <button class="btn btn-regar" onclick="enviarOrden('regar')">💧 Regar</button>
        <button class="btn btn-parar" onclick="enviarOrden('parar')">🛑 Parar</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let mins = 0.5;
    function cambiar(delta) {
      mins = parseFloat((mins + delta).toFixed(1));
      if (mins < 0.5) mins = 0.5;
      if (mins > 120.0) mins = 120.0;
      document.getElementById('minsLabel').innerText = mins;
    }

    function enviarOrden(accion) {
      if (accion === 'regar') {
        tg.sendData(`/regar ${mins}`);
      } else if (accion === 'parar') {
        tg.sendData(`/parar`);
      }
      tg.close();
    }
  </script>
</body>
</html>
